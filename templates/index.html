<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index</title>
  <link rel="stylesheet" type="text/css" href="../static/css_reset.css">
  <link rel="stylesheet" type="text/css" href="../static/login.css">
</head>
<body>
<!-- Homepage with an introduction to the game, login/register buttons. -->
  <nav class="navbar">
    <div class="title">
      <strong>Stock Market Simulation Game</strong>
    </div>
  </nav> 

  <div class="login-outer-border">
    <div class="login-header">
      <Strong>Log In</Strong>
      <div class="underline"></div>
    </div>

    <form action="{{ url_for('user_log_in') }}" method="POST"> 

    <div class="login-text-box-E">Email</div>
    <input type="email" name="email" class="login-input" placeholder="Enter your email" required>

    <div class="login-text-box-P">Password</div>
    <input type="password" name="password" class="login-input" placeholder="Enter your password" required>

    <button type="submit" class="login-button">Log In</button>
    </form>
    <div class="underline2"></div>

    {% if error_message %}
          <div class="error-message" style="color: red;text-align: center;">
              {{ error_message }}
          </div>
      {% endif %}

    <div class="login-bottom-link"> 
      Don't have an account?&nbsp;
      <a href="{{ url_for('register') }}"><strong>Sign Up</strong></a>
    </div>
  </div>

</body>
</html>
